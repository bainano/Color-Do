    /* 转两圈用多久：现在 60 秒转两圈，想快就把数字改小，想慢就改大 */
    :root {
      --spin-time: 60s;
      --font-hei: "CDHei", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;

    /* 一屏页面：html/body 高度严格等于视口，禁止滚动与触控板/触屏回弹 */
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body { background: #FAFAF9; }

    /* 整个页面的背景：钉死在视口上，页面怎么滚动都不跟着动 */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #FAFAF9; /* 与图片中心同色，万一露边也看不出来 */
    }

    /* 第一层：背景图，匀速不停地转
       设计稿：图片 2064×1168 放大 2 倍 = 4128×2336，
       画板（可见范围）1857.6×1051.2，所以图片是可见范围的 4128/1857.6 ≈ 2.2222 倍。
       网页按这个比例等比缩放，窗口怎么变都和设计稿里看到的一致。 */
    .backdrop__bg {
      /* 转到 45 度时仍能盖满视口的最小边长；特别扁或特别高的屏幕会自动补一点 */
      --need: calc((100vw + 100vh) * 0.7072 + 56px);
      position: absolute;
      top: 50%;
      left: 50%;
      width: max(222.222vw, var(--need));
      height: max(222.222vh, var(--need));
      background-image: url("背景图.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover; /* 比例不变、最大铺满、多出来的部分裁掉 */
      transform: translate(-50%, -50%) rotate(0deg);
      animation: spin var(--spin-time) linear infinite;
      will-change: transform;
    }

    @keyframes spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(720deg); }
    }

    /* 第二层：中间层，正好一个视口大小，静止不动，叠在背景图上面 */
    .backdrop__mid {
      position: absolute;
      inset: 0;
      background-image: url("中间层.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }

    /* 内容层：固定钉在视口上，正好一屏，不参与文档高度计算
       LOGO 在上、按钮在下（A 摆位，暂定） */
    .page {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1;
      height: 100vh;
      height: 100dvh;   /* 手机上端地址栏收起时也正好一屏 */
      padding: 32px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 64px;
    }

    /* 720px 是桌面大标宽；192px = 上下内边距 64 + 与按钮间距 64 + 按钮高 64。
       窗口很矮时按剩下的高度等比收窄，保证整组始终装在一屏里。
       第一屏的空位与全站唯一的 LOGO 图片共用这个宽度。 */
    :root {
      --logo-big: min(720px, 86vw, calc(max(0px, 100dvh - 192px) * 4.2566));
    }

    /* 全站唯一的 LOGO 元素：第一屏是中央大标，第二屏缩小飞到左上角顶栏。
       固定定位 + transform: translate() scale() 做 FLIP，绝不新建第二个 img。
       transform-origin 取左上，JS 才能直接用槽位的 left / top / width 算缩放。 */
    .hero__logo {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 4;
      display: block;
      width: var(--logo-big);
      height: auto;
      transform-origin: 0 0;
      /* 明显非线性的缓动：起步慢、中段加速、末段稳稳收住，不用 linear 的机械匀速感 */
      transition: transform .78s cubic-bezier(.68, 0, .18, 1);
      opacity: 0;              /* JS 定位好再显示，避免首帧闪一下 */
      pointer-events: none;    /* 第一屏不挡任何点击 */
      user-select: none;
      will-change: transform;
    }
    body.is-second .hero__logo { pointer-events: auto; cursor: pointer; }

    /* 第一屏里给 LOGO 留的空位（视觉上由上面那个 fixed 图片覆盖） */
    .logo-slot--hero {
      width: var(--logo-big);
      aspect-ratio: 4.2566;    /* 完整版 LOGO 的宽高比 */
    }

    /* 切到第二屏时第一屏内容淡出；LOGO 是独立层，不跟着淡出。
       这里只改 opacity、不做位移：.page 一旦变形，里面的 LOGO 槽位 rect 就会偏，
       LOGO 飞回来时会落错位置。 */
    .page { transition: opacity .38s ease; }
    body.is-second .page { opacity: 0; pointer-events: none; }

    /* 药丸按钮：半透明白 + 把背后的渐变模糊掉（毛玻璃） */
    .hero__cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 64px;
      /* 左边比右边多 6px：文字重、箭头轻，内容整体右移 3px 才是视觉居中 */
      padding: 0 46px 0 52px;
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 999px;
      background: rgba(255, 255, 255, .55);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
      backdrop-filter: blur(18px) saturate(1.5);
      box-shadow: 0 10px 30px rgba(31, 36, 48, .10);
      color: #1F2430;
      font: 400 18px/1 var(--font-hei);
      letter-spacing: .03em;
      cursor: pointer;
      transition: background .14s ease, border-color .14s ease, box-shadow .14s ease, transform .08s ease;
    }

    /* 右箭头：细线、跟文字同色；只用 transform 动，不挤动按钮宽度
       垂直方向保持 flex 的几何居中，箭头横线正好落在文字中线上。
       不要再额外上提/下移：曾按「汉字上密下疏」上提 1px，
       结果横线比文字中线高 1px，肉眼看着箭头靠上 */
    .hero__cta__arrow {
      flex: none;
      width: 20px;
      height: 20px;
      overflow: visible;   /* hover 右移 4px 时，箭头尖不会被 SVG 画布裁掉 */
      opacity: .72;
      transition: transform .16s ease, opacity .16s ease;
    }

    /* 切到第二屏之前：箭头整段可见地向右飞出，同时淡出。
       前半段保持不透明、飞得足够远，才能「基本完全看见」这一下飞出；
       只动箭头，不动按钮宽度，也不把箭头裁掉。 */
    @keyframes arrow-fly {
      0%   { transform: translateX(0);      opacity: .72; }
      12%  { opacity: 1; }
      70%  { transform: translateX(78px);  opacity: 1; }
      100% { transform: translateX(108px); opacity: 0; }
    }
    .hero__cta.is-launching .hero__cta__arrow {
      position: relative;
      z-index: 6;
      transition: none;
      animation: arrow-fly .28s cubic-bezier(.32, .02, .22, 1) forwards;
    }
    /* 回到第一屏时箭头瞬间归位，不要出现「飞回来」的假动画 */
    .hero__cta.is-resetting .hero__cta__arrow { transition: none; animation: none; }

    /* 系统原生按钮那种 hover：只是底色变实一点，不做上移 */
    .hero__cta:hover {
      background: rgba(255, 255, 255, .74);
      border-color: rgba(255, 255, 255, .95);
      box-shadow: 0 12px 34px rgba(31, 36, 48, .13);
    }

    /* 系统里常见的箭头反馈：悬停时轻轻往右挪一点 */
    .hero__cta:hover .hero__cta__arrow {
      transform: translateX(4px);
      opacity: 1;
    }

    /* 按下去：底色压深 + 内阴影 + 轻微内缩，像被按进页面里 */
    .hero__cta:active {
      background: rgba(231, 237, 248, .92);
      border-color: rgba(255, 255, 255, .7);
      box-shadow: inset 0 2px 7px rgba(31, 36, 48, .14), 0 4px 14px rgba(31, 36, 48, .08);
      transform: scale(.97);
    }

    /* 按下时箭头收回一点，跟按钮一起有「压下去」的感觉 */
    .hero__cta:active .hero__cta__arrow {
      transform: translateX(2px);
    }

    .hero__cta:focus-visible {
      outline: 2px solid #2E56C8;
      outline-offset: 3px;
    }

    /* ===== 顶部透明导航栏 ===== */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 3;
      height: 84px;
      padding: 0 clamp(20px, 3.5vw, 48px);
      display: flex;
      align-items: center;
      justify-content: flex-end;  /* 第一屏左上角留空：大 LOGO 已在画面中央 */
      gap: 12px;                 /* 三个按钮之间的间距 */
      background: transparent;   /* 完全透明：无底色、无分隔线 */
      pointer-events: none;      /* 透明部分不挡住下面的页面 */
    }

    /* 第二屏左上角的 LOGO 落点：一个空槽，第一屏时完全看不见 */
    .logo-slot--top {
      position: absolute;
      left: clamp(20px, 3.5vw, 48px);
      top: 50%;
      transform: translateY(-50%);
      width: 148px;
      aspect-ratio: 4.2566;
      pointer-events: none;
    }

    .nav-download {
      position: relative;
      pointer-events: auto;
    }

    /* 右上角下载按钮：和主按钮同一套毛玻璃药丸，尺寸小一号 */
    .nav-btn {
      display: inline-flex;
      text-decoration: none;   /* <a> 版按钮不要浏览器默认下划线 */
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 19px 0 21px;
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 999px;
      background: rgba(255, 255, 255, .55);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
      backdrop-filter: blur(18px) saturate(1.5);
      box-shadow: 0 8px 24px rgba(31, 36, 48, .10);
      color: #1F2430;
      font: 400 15px/1 var(--font-hei);
      letter-spacing: .02em;
      cursor: pointer;
      transition: background .14s ease, border-color .14s ease, box-shadow .14s ease, transform .08s ease;
    }

    /* 纯文字按钮（无图标 / 无箭头）：左右内边距对称，文字才是视觉居中 */
    .nav-btn--plain { padding: 0 22px; }

    .nav-btn__chevron {
      flex: none;
      width: 14px;
      height: 14px;
      opacity: .72;
      transition: transform .16s ease, opacity .16s ease;
    }

    /* 顶栏透明部分不挡页面，但两个按钮本身必须能点 */
    .topbar > .nav-btn { pointer-events: auto; }

    /* GitHub 图标：实心 mark，跟文字同色；保持 flex 几何居中 */
    .nav-btn__gh {
      flex: none;
      width: 17px;
      height: 17px;
      fill: currentColor;
      opacity: .85;
      transition: opacity .16s ease;
    }
    .nav-btn:hover .nav-btn__gh { opacity: 1; }

    /* hover 与主按钮差不多：底色变实、白边变亮、阴影微增，不上移 */
    .nav-btn:hover,
    .nav-btn.is-open {
      background: rgba(255, 255, 255, .74);
      border-color: rgba(255, 255, 255, .95);
      box-shadow: 0 10px 28px rgba(31, 36, 48, .13);
    }
    .nav-btn:hover .nav-btn__chevron { transform: translateY(2px); opacity: 1; }
    .nav-btn.is-open .nav-btn__chevron { transform: rotate(180deg); opacity: 1; }

    /* 按下刻意做得比主按钮克制：底色只压一点、内阴影很淡、几乎不缩放 */
    .nav-btn:active {
      background: rgba(240, 244, 250, .86);
      border-color: rgba(255, 255, 255, .78);
      box-shadow: inset 0 1px 3px rgba(31, 36, 48, .08), 0 6px 18px rgba(31, 36, 48, .08);
      transform: scale(.995);
    }

    .nav-btn:focus-visible {
      outline: 2px solid #2E56C8;
      outline-offset: 3px;
    }

    /* 下拉面板：外框保持原样（尺寸 / 圆角 / 毛玻璃 / 边框 / 阴影都不变），
       只去掉内边距并让这一层裁切内容：里面的条目铺满宽度、自身不带圆角，
       四角的圆弧完全由外层这一个圆角提供 */
    .nav-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 288px;
      max-width: calc(100vw - 40px);
      max-height: calc(100dvh - 104px);
      overflow-x: hidden;   /* 配合圆角裁掉条目直角的四角 */
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0;           /* 条目才能一直铺到面板边缘 */
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 16px;
      background: rgba(255, 255, 255, .72);
      -webkit-backdrop-filter: blur(22px) saturate(1.5);
      backdrop-filter: blur(22px) saturate(1.5);
      box-shadow: 0 18px 46px rgba(31, 36, 48, .16);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease, visibility .16s;
    }

    .nav-menu.is-open {
      opacity: 1;
      visibility: visible;
      transform: none;
      pointer-events: auto;
    }

    /* 一个版本一个条目：不再按 Windows / macOS 分组，四条平铺 */
    .dl-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      padding: 10px 14px;
      border-radius: 0;                            /* 条目本身不要圆角 */
      border-bottom: 1px solid rgba(31, 36, 48, .07);  /* 只用细线分隔，暂定 */
      color: #1F2430;
      text-decoration: none;
      transition: background .14s ease;
    }
    .dl-item:last-child { border-bottom: 0; }

    .dl-item__text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .dl-item__line { display: flex; align-items: center; gap: 8px; }
    .dl-item__name {
      font: 400 14px/1.2 var(--font-hei);
      white-space: nowrap;
    }

    /* 架构代号做小标签：标题用「64 位 / 32 位」这类说法，
       x64 / x86 / arm64 / x86_64 只出现在标签里 */
    .dl-item__tag {
      flex: none;
      padding: 3px 7px;
      border: 0;                /* 不要框线 */
      border-radius: 5px;
      background: #111318;      /* 黑底 */
      color: #FFFFFF;           /* 白字 */
      font: 400 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .02em;
      white-space: nowrap;
    }
    .dl-item__meta {
      color: #8B93A5;
      font: 400 11px/1.2 var(--font-hei);
    }
    .dl-item__icon {
      flex: none;
      width: 16px;
      height: 16px;
      margin-left: auto;
      opacity: .55;
      transition: opacity .16s ease;
    }

    .dl-item:hover { background: rgba(255, 255, 255, .72); }
    .dl-item:hover .dl-item__icon { opacity: 1; }

    /* 铺满之后不再缩放（整行缩放会在面板边缘露缝），按下只压一点底色，保持克制 */
    .dl-item:active { background: rgba(231, 237, 248, .88); }

    .dl-item:focus-visible {
      outline: 2px solid #2E56C8;
      outline-offset: -2px;
    }

    /* ===== 第二屏：整个视口一屏，标题 / 日期组 / 作者信息叠在继续旋转的背景上 ===== */
    .screen2 {
      position: fixed;
      inset: 0;
      z-index: 2;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .5s ease, visibility .5s;
    }
    body.is-second .screen2 {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* 很淡的一层白纱：让文字更清楚，旋转的背景仍然透出来、不中断 */
    .screen2::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(250, 250, 249, .62);
    }

    .screen2__title {
      position: absolute;
      left: clamp(28px, 7.6vw, 124px);
      top: clamp(104px, 17.2vh, 192px);
      max-width: min(960px, 84vw);
      margin: 0;
      color: #1F2430;
      font: 300 clamp(32px, 3.6vw, 56px)/1.4 var(--font-hei);
      letter-spacing: .005em;
    }

    /* 品牌名用官方字标（colo-do-logo-text.svg），不再用字体打出来的拉丁字母。
       高度按 em 走：标题字号一变，字标跟着等比缩放，不会在某个窗口里突然变大变小。
       字标导出已含底部少量留白，vertical-align 只做基线微调。 */
    .screen2__wordmark {
      display: inline-block;
      height: .86em;
      width: auto;
      vertical-align: -.08em;
      margin-right: .24em;   /* 抵掉原来「Color Do 是…」中间那个空格，句子才不黏在一起 */
      user-select: none;
      -webkit-user-drag: none;
    }

    /* 日期和「即将推出」抱成一组整体居中：两者只隔一点点，底部整块留给作者信息 */
    .screen2__center {
      position: absolute;
      left: 50%;
      top: 47%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(14px, 2.2vh, 26px);
      white-space: nowrap;
    }

    /* 日期改成 canvas 绘制：清亮粉彩在字里由噪声驱动自由晕开、散开。
       font-size 仍由 CSS 响应式给出，JS 读取后按实测字宽设定 canvas 的真实像素尺寸；
       负字距、墨迹的横竖居中都在 canvas 里自己算，不会被 CSS 拉伸变形。 */
    .screen2__date {
      display: block;
      font-size: clamp(104px, 15.5vw, 216px);   /* JS 读取这个值来定字号 */
      line-height: 1;
      width: 4.1em;                             /* JS 就绪前的占位，避免布局跳动 */
      height: 1.1em;
      max-width: none;
    }

    /* 正字距同理，抵消末尾空格 */
    .screen2__soon {
      color: #5B6478;
      font: 400 clamp(14px, 1.4vw, 18px)/1 var(--font-hei);
      letter-spacing: .35em;
      margin-right: -.35em;
    }

    /* 底部作者信息：一小行，不抢日期的戏 */
    .screen2__author {
      position: absolute;
      left: 50%;
      bottom: clamp(30px, 5.5vh, 62px);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.4vw, 34px);
      white-space: nowrap;
      font: 400 clamp(12px, 1.05vw, 14px)/1.6 var(--font-hei);
    }
    .screen2__author__cell { display: flex; align-items: baseline; gap: 10px; }
    .screen2__author__k {
      color: #8B93A5;
      letter-spacing: .18em;
      margin-right: -.18em;
    }
    .screen2__author__v { color: #3A4256; letter-spacing: .02em; }
    .screen2__author__divider {
      flex: none;
      width: 1px;
      height: 14px;
      background: rgba(31, 36, 48, .18);
    }
    a.screen2__author__v {
      text-decoration: none;
      border-bottom: 1px solid rgba(31, 36, 48, .22);
      padding-bottom: 1px;
      transition: color .16s ease, border-color .16s ease;
    }
    a.screen2__author__v:hover { color: #2E56C8; border-color: #2E56C8; }
    a.screen2__author__v:focus-visible { outline: 2px solid #2E56C8; outline-offset: 3px; }

    /* 依次淡入上浮；返回时 delay 反过来，按倒序退场，来回都顺 */
    .screen2__title,
    .screen2__date,
    .screen2__soon,
    .screen2__author { opacity: 0; }

    .screen2__title {
      transform: translateY(16px);
      transition: opacity .55s ease, transform .55s ease;
      transition-delay: .26s;
    }
    .screen2__date {
      transform: translateY(18px);
      transition: opacity .6s ease, transform .6s ease;
      transition-delay: .16s;
    }
    .screen2__soon {
      transform: translateY(14px);
      transition: opacity .55s ease, transform .55s ease;
      transition-delay: .06s;
    }
    .screen2__author {
      transform: translate(-50%, 14px);
      transition: opacity .55s ease, transform .55s ease;
      transition-delay: 0s;
    }

    body.is-second .screen2__title  { opacity: 1; transform: none; transition-delay: 0s; }
    body.is-second .screen2__date   { opacity: 1; transform: none; transition-delay: .10s; }
    body.is-second .screen2__soon   { opacity: 1; transform: none; transition-delay: .18s; }
    body.is-second .screen2__author { opacity: 1; transform: translateX(-50%); transition-delay: .26s; }

    /* 很矮的窗口：标题 / 日期组 / 作者信息各占一层，不能互相压住 */
    @media (max-height: 520px) {
      .screen2__title {
        top: 88px;
        font-size: clamp(18px, 2.4vw, 26px);
        max-width: min(620px, 76vw);
      }
      .screen2__center { top: 52%; gap: 10px; }
      .screen2__date { font-size: clamp(56px, 16vh, 96px); }
      .screen2__soon { font-size: 13px; letter-spacing: .28em; margin-right: -.28em; }
      .screen2__author { bottom: 16px; gap: 14px; font-size: 11px; }
    }

    /* 窄屏：邮箱比较长，作者信息改成上下两行，避免挤出屏幕 */
    @media (max-width: 560px) {
      .screen2__author {
        flex-direction: column;
        gap: 5px;
        bottom: clamp(20px, 4vh, 40px);
        font-size: 12px;
      }
      .screen2__author__divider { display: none; }
    }

    /* 很窄的屏幕（手机）：三个按钮仍要排在同一行且不被裁切，只收紧间距 / 内边距 / 字号。
       顶栏横向塞不下「小 LOGO + 三个按钮」，所以第二屏的小 LOGO 落到顶栏正下方，
       仍在画面左上角；标题相应下移，避免压住它。（助手暂定） */
    @media (max-width: 400px) {
      .topbar { gap: 8px; padding: 0 12px; }
      .nav-btn { padding: 0 14px 0 16px; font-size: 14px; }
      .nav-btn--plain { padding: 0 14px; }
      .logo-slot--top {
        left: 12px;
        top: 96px;
        transform: none;
        width: 104px;
      }
      .screen2__title { top: 148px; max-width: 78vw; font-size: 26px; }
      .screen2__center { top: 46%; }
    }

    /* ===== 两屏切换：同一个 LOGO 缩放飞到左上角，页面始终不滚动 ===== */
    (function () {
      var logo = document.getElementById('brand-logo');
      var heroSlot = document.querySelector('.logo-slot--hero');
      var topSlot = document.querySelector('.logo-slot--top');
      var first = document.getElementById('screen1');
      var secondScreen = document.getElementById('screen2');
      var cta = document.querySelector('.hero__cta');
      var menu = document.getElementById('download-menu');
      var isSecond = false;
      var lockUntil = 0;
      var launching = false;
      var launchTimer = null;
      var CUT_MS = 140;              /* 箭头飞到约一半就切屏，后半段与切屏动画重叠（箭头共 .28s） */
      var HOLD_MS = 650;             /* 防连跳，比原来短一点，来回更跟手 */

      /* FLIP：把 LOGO 摆到「当前屏的槽位」上。
         槽位 left / top / width 是视口坐标，LOGO 是 fixed + transform-origin: 0 0，
         所以 translate + scale 就能精确对齐，缩放后宽高比不变。 */
      function placeLogo(animate) {
        var slot = isSecond ? topSlot : heroSlot;
        var r = slot.getBoundingClientRect();
        var w = parseFloat(getComputedStyle(logo).width) || logo.offsetWidth;
        if (!w || !r.width) return;
        var s = r.width / w;
        if (!animate) logo.style.transition = 'none';
        logo.style.transform = 'translate(' + r.left + 'px, ' + r.top + 'px) scale(' + s + ')';
        if (!animate) {
          void logo.offsetWidth;
          logo.style.transition = '';
        }
      }

      /* 箭头归位：先关掉过渡再摘掉飞出动画，避免「飞回来」的假动画 */
      function resetArrow() {
        cta.classList.add('is-resetting');
        cta.classList.remove('is-launching');
        void cta.offsetWidth;
        requestAnimationFrame(function () { cta.classList.remove('is-resetting'); });
      }

      function go(next) {
        if (launchTimer) { clearTimeout(launchTimer); launchTimer = null; }
        launching = false;
        if (!next) resetArrow();          /* 回第一屏 / 取消出发，箭头瞬间回位 */
        if (next === isSecond) return;
        isSecond = next;
        document.body.classList.toggle('is-second', isSecond);
        first.setAttribute('aria-hidden', String(isSecond));
        secondScreen.setAttribute('aria-hidden', String(!isSecond));
        placeLogo(true);
        lockUntil = Date.now() + HOLD_MS;

         不是「等箭头完全结束才轮到切屏」，进入第二屏感官上更快 */
      function enterSecond(ignoreLock) {
        if (isSecond || launching) return;
        if (!ignoreLock && Date.now() < lockUntil) return;
        launching = true;
        lockUntil = Date.now() + CUT_MS + HOLD_MS;
        cta.classList.remove('is-resetting');
        cta.classList.add('is-launching');
        launchTimer = setTimeout(function () {
          launchTimer = null;
          go(true);
        }, CUT_MS);

      function init() {
        placeLogo(false);
        logo.style.opacity = '1';

        document.addEventListener('DOMContentLoaded', init);

        init();
      }
      window.addEventListener('load', function () { placeLogo(false); });
      window.addEventListener('resize', function () { placeLogo(false); });

      cta.addEventListener('click', function () { enterSecond(true); });
      logo.addEventListener('click', function () { if (isSecond) go(false); });

        e.preventDefault();

        if (e.deltaY > 0) enterSecond(); else go(false);
      }, { passive: false });

      document.addEventListener('keydown', function (e) {
        /* 下拉自己刚处理过的 Esc（关菜单）不要再拿来切屏 */
        if (e.defaultPrevented || menu.classList.contains('is-open')) return;
        if (e.key === 'ArrowDown' || e.key === 'PageDown') {
          e.preventDefault(); enterSecond();

    /* ===== 第二屏的彩色日期：噪声驱动的自由晕染 + 离屏文字掩码，不用原生描边 ===== */
    var dateArtReady = (function () {
      var cv = document.getElementById('date-canvas');
      var ctx = cv.getContext('2d');
      var maskCv = document.createElement('canvas');   /* 整串文字合成一个掩码 */
      var mctx = maskCv.getContext('2d');
      var layerCv = document.createElement('canvas');  /* 彩色字层：颜色场裁进字形 */
      var lctx = layerCv.getContext('2d');
      var fieldCv = document.createElement('canvas');  /* 低分辨率噪声颜色场 */
      var fctx = fieldCv.getContext('2d');
      var chars = ['1', '2', '.', '1'];
      var FONT_W = 500;
      var PAD = .06;                 /* 左右留白，按 em */
      var FW = 80, FH = 40;         /* 噪声场分辨率：小场放大，颜色天然晕开 */
      fieldCv.width = FW; fieldCv.height = FH;
      var fieldImg = fctx.createImageData(FW, FH);
      var INK = [31, 36, 48];

      function L(a, b, t){ return a + (b - a) * t; }
      function cl(v){ return Math.max(0, Math.min(255, Math.round(v))); }

      /* 清亮粉彩：品牌四色先与白色大幅混合（轻盈、清亮、不鲜艳浓亮），
         再混一点深墨，浅背景上才不会糊掉。 */
      function pastel(c, w, ink){
        return [L(L(c[0],255,w),INK[0],ink),
                L(L(c[1],255,w),INK[1],ink),
                L(L(c[2],255,w),INK[2],ink)];
      }
      var COLORS = [
        pastel([81,255,0],  .40, .17),   /* 淡薄荷绿 */
        pastel([251,255,0], .42, .17),   /* 奶油黄   */
        pastel([0,255,255], .38, .17),   /* 淡青     */
        pastel([46,86,200], .32, .17)    /* 雾蓝     */
      ];
      var BASE = pastel([150,206,224], .34, .16);   /* 墨滴之间的清亮底色：带一点青，避免空档发白让笔画「断掉」 */

      /* 固定伪随机表 + 双线性平滑插值 = 轻量 2D value noise。
         一次生成、之后 O(1) 查表，30fps 也不吃 CPU。 */
      var RND = new Float32Array(256 * 256);
      (function(){
        var seed = 20261115;
        for(var i=0;i<RND.length;i++){
          seed = (seed * 1664525 + 1013904223) >>> 0;
          RND[i] = seed / 4294967296;
        }
      })();
      function hash2(x,y){ return RND[((y & 255) << 8) | (x & 255)]; }
      function noise2(x,y){
        var xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
        var u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
        var a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
        return L(L(a,b,u), L(c,d,u), v);
      }

      /* 四个彩色「墨滴」：周期、方向、相位、半径都不同，乘积项让轨迹没有统一方向；
         它们各自漂移、呼吸、互相融合，再加上噪声揉皱边界，就是自动晕开散开的流动色。 */
      var BLOBS = [
        {cx:.20, cy:.30, ax:2400, ay:3100, ar:2100, px:.3,  py:1.1, rx:.27, ry:.25},
        {cx:.78, cy:.26, ax:3300, ay:2300, ar:2700, px:2.4, py:.5,  rx:.25, ry:.28},
        {cx:.28, cy:.78, ax:2900, ay:3600, ar:1900, px:1.2, py:2.7, rx:.28, ry:.24},
        {cx:.80, cy:.76, ax:3800, ay:2700, ar:2400, px:3.6, py:1.8, rx:.25, ry:.27}
      ];

      var fs=0, cssW=0, cssH=0, widths=[], sp=0, total=0, startX=0, baseline=0;

      function setFont(){
        ctx.font = FONT_W+' '+fs+'px "CDDate", sans-serif';
        ctx.textBaseline = 'alphabetic';
      }
      function metrics(){
        var w=chars.map(function(c){ return ctx.measureText(c).width; });
        var gap=-.045*fs, sum=0;
        for(var i=0;i<w.length;i++) sum+=w[i];
        return {w:w, gap:gap, textW:sum+gap*(w.length-1)};
      }
      function layout(){
        fs=parseFloat(getComputedStyle(cv).fontSize)||200;
        setFont();
        var m=metrics(), need=m.textW+2*PAD*fs;
        /* 窄屏按可用宽度整体缩字号，不用 CSS 压 canvas（压了会变形） */
        var maxW=window.innerWidth*.92;
        if(need>maxW){
          var k=maxW/need; fs=fs*k; setFont(); m=metrics(); need=m.textW+2*PAD*fs;
        }
        widths=m.w; sp=m.gap; total=m.textW;
        cssW=Math.ceil(need); cssH=Math.ceil(fs*1.1);
        cv.style.width=cssW+'px'; cv.style.height=cssH+'px';
        var dpr=Math.min(window.devicePixelRatio||1,2);
        cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);   /* 改 width/height 会清空状态，须重设 */
        setFont();

        maskCv.width=cv.width; maskCv.height=cv.height;
        mctx.setTransform(dpr,0,0,dpr,0,0);
        mctx.font=FONT_W+' '+fs+'px "CDDate", sans-serif';
        mctx.textBaseline='alphabetic';
        layerCv.width=cv.width; layerCv.height=cv.height;
        lctx.setTransform(dpr,0,0,dpr,0,0);

        var box=ctx.measureText('12.1');
        var asc=box.actualBoundingBoxAscent||fs*.72;
        var desc=box.actualBoundingBoxDescent||fs*.02;
        baseline=(cssH+asc-desc)/2;          /* 墨迹中心正好在 canvas 中线 */
        startX=PAD*fs;

        /* 掩码只在布局变化时重画：四个字符在离屏画布上合成「一个整体」，
           之后每帧只做一次 destination-in，不会互相清空。 */
        mctx.clearRect(0,0,cssW,cssH);
        mctx.fillStyle='#000';
        var mx=startX;
        for(var i=0;i<chars.length;i++){
          mctx.fillText(chars[i],mx,baseline); mx+=widths[i]+sp;
        }
      }

      /* 低分辨率噪声颜色场：每个像素由「四个漂移墨滴的加权混合 + 噪声扭曲坐标」决定。
         没有主方向、没有扫光带，颜色会自己扩散、融合、散开。 */
      function paintField(t){
        var d=fieldImg.data, o=0, k;
        var bx=[], by=[], br=[];
        for(k=0;k<4;k++){
          var B=BLOBS[k];
          bx[k]=B.cx+B.rx*Math.sin(t/B.ax+B.px)*Math.cos(t/(B.ay*.73)+B.py);
          by[k]=B.cy+B.ry*Math.cos(t/B.ay+B.py)*Math.sin(t/(B.ax*.81)+B.px);
          br[k]=.15+.24*(.5+.5*Math.sin(t/B.ar+B.px));
        }
        for(var j=0;j<FH;j++){
          var y=(j+.5)/FH;
          for(var i2=0;i2<FW;i2++){
            var x=(i2+.5)/FW;
            /* 两层噪声各自朝不同方向缓慢演化，叠加后无固定方向 */
            var n1=noise2(x*3.1+t*.00072, y*3.1-t*.00058);
            var n2=noise2(x*6.7-t*.00066+19.3, y*6.7+t*.00061+7.1);
            var wx=x+(n1-.5)*.42+(n2-.5)*.16;
            var wy=y+(n2-.5)*.42-(n1-.5)*.16;
            var sr=BASE[0]*.04, sg=BASE[1]*.04, sb=BASE[2]*.04, sw=.04;
            for(k=0;k<4;k++){
              var dx=wx-bx[k], dy=(wy-by[k])*1.25, r=br[k];
              var w=Math.exp(-(dx*dx+dy*dy)/(2*r*r));
              w=w*w*w*(.60+.80*n1);   /* 立方化让主色更明确，噪声让边界不规则地散开 */
              sr+=w*COLORS[k][0]; sg+=w*COLORS[k][1]; sb+=w*COLORS[k][2]; sw+=w;
            }
            var lum=.94+n1*.12;                 /* 轻微明暗起伏，像水彩浓淡 */
            var hi=Math.max(0,n2-.70)*.42;     /* 局部清亮高光，不是一条扫光带 */
            var R=L(sr/sw*lum,255,hi)+(n2-.5)*5;
            var G=L(sg/sw*lum,255,hi)+(n1-.5)*5;
            var Bl=L(sb/sw*lum,255,hi);
            d[o++]=cl(R); d[o++]=cl(G); d[o++]=cl(Bl); d[o++]=255;
          }
        }
        fctx.putImageData(fieldImg,0,0);
      }

      function draw(t){
        if(!cssW) return;
        paintField(t);

        /* 彩色字层：噪声场放大铺满（双线性插值天然晕开），再用整串掩码裁一次 */
        lctx.globalCompositeOperation='source-over';
        lctx.clearRect(0,0,cssW,cssH);
        lctx.imageSmoothingEnabled=true;
        lctx.imageSmoothingQuality='high';
        lctx.drawImage(fieldCv,0,0,cssW,cssH);
        lctx.globalCompositeOperation='destination-in';
        lctx.drawImage(maskCv,0,0,cssW,cssH);
        lctx.globalCompositeOperation='source-over';

        ctx.globalCompositeOperation='source-over';
        ctx.clearRect(0,0,cssW,cssH);
        /* 不用原生描边（strokeText 会有接缝/半透明 bug）：
           先画一层「带柔和外阴影的淡墨字」垫底，字内部随后被彩色层盖住，
           只在字外留一圈极淡的灰晕，清亮粉彩在浅背景上才有轮廓。 */
        ctx.save();
        ctx.shadowColor='rgba(31,36,48,.34)';
        ctx.shadowBlur=Math.max(2,fs*.022);
        ctx.shadowOffsetX=0;
        ctx.shadowOffsetY=Math.max(1,fs*.008);
        ctx.fillStyle='rgba(31,36,48,.12)';
        var px=startX;
        for(var i=0;i<chars.length;i++){
          ctx.fillText(chars[i],px,baseline); px+=widths[i]+sp;
        }
        ctx.restore();
        ctx.drawImage(layerCv,0,0,cssW,cssH);
      }

      var t0=performance.now(), last=-1;
      function loop(now){
        requestAnimationFrame(loop);
        if(document.hidden || now-last<32) return;   /* 约 30fps，够顺滑也不吃资源 */
        last=now;
        draw(now-t0);
      }
      function start(){
        layout();
        draw(0);
        if(!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)){
          requestAnimationFrame(loop);
        }
      }
      window.addEventListener('resize',function(){
        layout(); draw(performance.now()-t0);
      });

      /* 字体没就绪前不画第一帧：避免 canvas 先用系统字形画一遍再跳成 Rubik */
      return (document.fonts && document.fonts.load)
        ? document.fonts.load(FONT_W+' 100px "CDDate"','12.1')
            .then(function(){ return document.fonts.ready; }).then(start, start)
        : Promise.resolve().then(start);
    })();

    /* ===== 字体就绪前不显示任何文字，杜绝「先系统字、后黑体」的闪动 ===== */
    (function () {
      var root = document.documentElement;
      var logo = document.getElementById('brand-logo');
      var done = false;
      var fallback = setTimeout(reveal, 2500);   /* 兜底：字体万一失败也不白屏 */

      function reveal() {
        if (done) return;
        done = true;
        clearTimeout(fallback);
        root.classList.remove('fonts-pending');
      }

      var logoReady = (logo && !logo.complete)
        ? new Promise(function (res) {
            logo.addEventListener('load', res, { once: true });
            logo.addEventListener('error', res, { once: true });
          })
        : Promise.resolve();

      var fontReady = (document.fonts && document.fonts.load)
        ? Promise.all([
            document.fonts.load('400 16px "CDHei"', '即刻了解查看开源反馈下载是一款年轻人的待办软件即将推出作者联系BAINANO'),
            document.fonts.load('300 16px "CDHei"', 'Color Do 是一款年轻人的待办软件'),
            document.fonts.load('500 100px "CDDate"', '12.1')
          ]).then(function () { return document.fonts.ready; })
        : Promise.resolve();

      /* canvas 首帧也纳入等待：揭开页面时日期已经画好，不会先空一下 */
      Promise.all([fontReady, logoReady, dateArtReady]).then(reveal, reveal);
    })();
  </script>
</body>
</html>
